<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Toggle</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:sans-serif;
        }
        body{
            background:#250057;
        }
        .input-box{
            background:#fff;
            width:90%;
            max-width:500px;
            border-radius:5px;
            padding:10px 20px;
            margin:300px auto;
            display:flex;
            align-items:center;
        }
        .input-box input{
            width:100%;
            padding:10px 0;
            border:0;
            outline:0;
            font-size:24px;
            color:#555;
        }
        .input-box img{
            width:35px;
            cursor:pointer;
        }
    </style>
</head>
<body>
    <div class="input-box">
        <input id="password" type = "Password" placeholder = "Here">
        <img  id = "toggle">
    </div>
    <script>
        let password = document.getElementById("password");
        let toggle = document.getElementById("toggle");
        toggle.onclick=()=>{
            if(password.type =="password"){
                password.type = "text";
            }else{
                password.type="password";
            }
        }
    </script>
</body>
</html>
