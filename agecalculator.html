<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator</title>
    <style>
        *{
            margin:0;
            padding:0;
            font-family:sans-serif;
            box-sizing:border-box;
        }
        .container{
            width:100%;
            min-height:100vh;
            background:linear-gradient(135deg,#4203a9,#90bafc);
            color:#fff;
            padding:10px;
        }
        .calculator{
            width:100%;
            max-width:60px;
            margin-left:10%;
            margin-top:10%;
        }
        .calculator h1{
            font-size:60px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="calculator">
            <h1>Javascript Age Calculator</h1>
        </div>
    </div>
</body>
</html>
